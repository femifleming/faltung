name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-15 }
          - { name: Linux, os: ubuntu-22.04 }
          - { name: Windows, os: windows-2022 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libgl1-mesa-dev libcurl4-openssl-dev xvfb

      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: packaging/package-macos.sh

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: packaging/package-linux.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging/package-windows.ps1

      - name: Tests (macOS)
        if: runner.os == 'macOS'
        run: |
          T=build-release/ECRTest_artefacts/Release/ECRTest
          A=build-release/ConvoSolution_artefacts/Release
          build-release/ECREngineTest
          $T
          $T --host $A/VST3/ConvoSolution.vst3
          $T --host $A/VST/ConvoSolution.vst
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R $A/AU/ConvoSolution.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aufx CvSl Frkp | tail -3
          auval -v aufx CvSl Frkp | grep -q "AU VALIDATION SUCCEEDED"

      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: |
          T=build-release/ECRTest_artefacts/Release/ECRTest
          A=build-release/ConvoSolution_artefacts/Release
          build-release/ECREngineTest
          xvfb-run -a $T
          xvfb-run -a $T --host $A/VST3/ConvoSolution.vst3
          xvfb-run -a $T --host $A/VST/libConvoSolution.so || xvfb-run -a $T --host $A/VST/ConvoSolution.so
          xvfb-run -a $T --host $A/LV2/ConvoSolution.lv2

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $T = "build-release\ECRTest_artefacts\Release\ECRTest.exe"
          $A = "build-release\ConvoSolution_artefacts\Release"
          & "build-release\Release\ECREngineTest.exe"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $T; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $T --host "$A\VST3\ConvoSolution.vst3"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $T --host "$A\VST\ConvoSolution.dll"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ConvoSolution-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
